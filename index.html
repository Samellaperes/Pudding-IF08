<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pudding IF08</title>

    <!-- Bootstrap 5.3 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS personnalisé -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <!-- HEADER -->
    <header class="container py-5">
        <div class="row align-items-center">

            <!-- Texte -->
            <div class="col-lg-6 text-center text-lg-start">
                <h1 class="display-4 fw-bold">
                    Pudding
                </h1>

                <p class="lead">
                    Une recette gourmande et facile à réaliser.
                </p>

                <!-- Nutriscore moyen -->
                <div class="mt-4">
                    <span class="fw-bold">Nutri-Score moyen :</span>
                    <span id="nutriscore-moyen"></span>
                </div>
            </div>

            <!-- Image recette -->
            <div class="col-lg-6 text-center mt-4 mt-lg-0">
                <img
                    src="https://images.unsplash.com/photo-1505253716362-afaea1d3d1af?q=80&w=1200&auto=format&fit=crop"
                    alt="Pudding"
                    class="img-fluid rounded shadow">
            </div>

        </div>
    </header>

    <!-- SECTION INGREDIENTS -->
    <section class="container py-5">

        <div class="text-center mb-5">
            <h2 class="fw-bold">Ingrédients</h2>
            <p class="text-muted">
                Liste des ingrédients utilisés dans la recette.
            </p>
        </div>

        <!-- Zone dynamique -->
        <div id="productList" class="row g-4">

            <!-- Injection JS -->
            
        </div>

    </section>

    <!-- SECTION ETAPES -->
    <section class="container py-5">

        <div class="text-center mb-5">
            <h2 class="fw-bold">Étapes de préparation</h2>
            <p class="text-muted">
                Suivez les étapes pour réussir votre pudding.
            </p>
        </div>

        <!-- Zone dynamique -->
        <div id="steps" class="row g-4">

            <!-- Injection JS -->

        </div>

    </section>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <p class="mb-0">
                Projet IF08 - Pudding © 2025
            </p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Scripts JS -->
    <script src="js/ingredients.js"></script>
    <script src="js/nutriscore.js"></script>
    <script src="js/steps.js"></script>

</body>

</html>
